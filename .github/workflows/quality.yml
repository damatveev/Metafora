name: Plugin quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find plugins/importexport/metafora -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Parse XML metadata
        shell: bash
        run: |
          set -euo pipefail
          php -r '$d=new DOMDocument(); if (!$d->load("plugins/importexport/metafora/version.xml")) { exit(1); }'

      - name: Check committed secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = [
              re.compile(r"apiToken\s*=\s*['\"][A-Za-z0-9_-]{16,}['\"]"),
              re.compile(r"Authorization:\s*Bearer\s+[A-Za-z0-9._-]{16,}", re.IGNORECASE),
          ]

          offenders = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() == '.md':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if any(pattern.search(text) for pattern in patterns):
                  offenders.append(str(path))

          if offenders:
              print('Potential committed API secret detected:', file=sys.stderr)
              for offender in offenders:
                  print(f'  {offender}', file=sys.stderr)
              sys.exit(1)
          PY
