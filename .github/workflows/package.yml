name: Build plugin package

on:
  push:
    branches: [develop, develop-metafora-export]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.php
          test -f MetaforaExportPlugin.php
          test -f version.xml
          test -d locale
          test -d templates

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/metafora
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='*.bak' \
            --exclude='*.before_*' \
            --exclude='*.broken*' \
            --exclude='*.bad_*' \
            --exclude='*.error' \
            --exclude='*.failed' \
            ./ dist/metafora/
          cd dist
          zip -r metafora-ojs35.zip metafora

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: metafora-ojs35
          path: dist/metafora-ojs35.zip
          if-no-files-found: error
